name: Panel mensual iNaturalist

on:
  schedule:
    - cron: "45 13 7 * *"      # día 1 de cada mes, 7:00 UTC
  workflow_dispatch:          # permite lanzarlo a mano con un botón

permissions:
  contents: write             # permite guardar resultados en el repositorio

jobs:
  generar-paneles:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Instalar librerías del sistema (para el mapa)
        timeout-minutes: 10
        run: |
          sudo apt-get update
          sudo apt-get install -y libgdal-dev libgeos-dev libproj-dev libudunits2-dev locales
          sudo locale-gen es_ES.UTF-8

      - name: Instalar R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Instalar paquetes de R
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::tidyverse
            any::lubridate
            any::patchwork
            any::sf
            any::rnaturalearth
            any::rnaturalearthdata
            any::httr2

      - name: Ejecutar el script
        run: Rscript panel_inat_api.R

      - name: Guardar resultados en el repositorio
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add figures data
          git diff --cached --quiet || git commit -m "Paneles actualizados"
          git push
